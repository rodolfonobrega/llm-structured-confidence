[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-confidence"
version = "0.1.0"
description = "Extract per-field confidence scores from LLM structured JSON outputs using token-level log-probabilities."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "llm-confidence contributors" },
]
keywords = ["llm", "logprobs", "confidence", "structured-output", "classification", "enum"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "lark>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "python-dotenv",
]
litellm = [
    "litellm",
]
genai = [
    "google-genai",
]

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/llm-confidence"
Repository = "https://github.com/YOUR_USERNAME/llm-confidence"
Issues = "https://github.com/YOUR_USERNAME/llm-confidence/issues"

[tool.pytest.ini_options]
testpaths = ["llm_confidence/tests"]

[tool.hatch.build.targets.wheel]
packages = ["llm_confidence"]
